<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurgiFlow - Cirugía General Tarapoto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Encabezado Superior Profesional -->
    <header>
        <div class="logo-area">
            <h1>
                <span>🏥</span> SurgiFlow 
                <span class="badge-ro">CIRUGÍA GENERAL</span>
            </h1>
            <p style="margin: 3px 0 0; font-size: 12px; color: #64748b;">
                🏥 HOSPITAL TARAPOTO II-2 MINSA &bull; <strong>Dra. Vigo Gamboa Laura Tatiana</strong>
            </p>
        </div>
        <div class="user-info">
            <span>R2 Cirugía General</span>
        </div>
    </header>

    <!-- Barra de Navegación Principal -->
    <nav class="nav-bar">
        <button class="nav-btn active">📊 Torre de Control & KPIs</button>
        <button class="nav-btn">🏥 Hospitalización</button>
        <button class="nav-btn">🚨 Emergencia</button>
    </nav>

    <!-- Sección de Camas y Controles -->
    <main>
        <div class="section-header">
            <h3 style="margin:0; color: #be185d;">CAMAS HOSPITALIZACIÓN (218-A a 224-B)</h3>
            <button id="btn-ingreso" class="btn-pink">+ Ingresar Paciente</button>
        </div>

        <!-- Grilla de Camas Oficiales -->
        <div id="grid-camas" class="grid-container">
            <!-- Generado por JavaScript -->
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
