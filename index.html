<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torre de Control - Cirugía General Tarapoto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🏥 Hospital II-2 Tarapoto</h1>
        <p>Servicio de Cirugía General - Torre de Control & Guardia</p>
    </header>

    <main>
        <!-- Panel de Resumen de Guardia -->
        <section class="dashboard-stats">
            <div class="stat-box">
                <h3>Censo Total</h3>
                <p id="total-pacientes">0</p>
            </div>
            <div class="stat-box">
                <h3>Camas Prestadas</h3>
                <p id="total-prestadas">0</p>
            </div>
            <div class="stat-box">
                <h3>Retenidos URPA</h3>
                <p id="total-urpa">0</p>
            </div>
        </section>

        <!-- Botón para Nuevo Ingreso -->
        <div class="actions-bar">
            <button id="btn-ingreso" class="btn-primary">+ Registrar Nuevo Paciente / Ingreso</button>
        </div>

        <!-- Grilla de Camas Oficiales (218-A a 224-B) -->
        <section id="dashboard">
            <h2>Camas del Servicio (218-A a 224-B)</h2>
            <div id="grid-camas" class="grid-container">
                <!-- Se generan dinámicamente -->
            </div>
        </section>

        <!-- Sección de Camas Prestadas y URPA -->
        <section id="extras-section">
            <h2>Camas Extramurales / Prestadas y URPA</h2>
            <div id="grid-extras" class="grid-container">
                <!-- Se generan dinámicamente -->
            </div>
        </section>
    </main>

    <!-- Modal de Ingreso / Edición de Paciente -->
    <div id="modal-paciente" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Gestión de Cama / Paciente</h2>
            <form id="form-paciente">
                <label>Número de Cama / Ubicación:</label>
                <input type="text" id="input-cama" readonly>

                <label>Apellidos y Nombres:</label>
                <input type="text" id="input-nombre" placeholder="Ej. Pérez Gómez, Juan" required>

                <label>Historia Clínica (HC):</label>
                <input type="text" id="input-hc" placeholder="Número de HC" required>

                <label>Diagnóstico Postoperatorio / Principal:</label>
                <textarea id="input-diagnostico" placeholder="Ej. Post-operado de Apendicectomía Laparoscópica Día 1"></textarea>

                <label>Comorbilidades / Antecedentes:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" value="HTA"> HTA</label>
                    <label><input type="checkbox" value="DM2"> DM2</label>
                    <label><input type="checkbox" value="IRC"> IRC</label>
                    <label><input type="checkbox" value="Ant. Quirúrgicos"> Cirugías Previas</label>
                </div>

                <label>Semáforo de Riesgo Clínico:</label>
                <select id="input-riesgo">
                    <option value="verde">Verde - Estable</option>
                    <option value="amarillo">Amarillo - Observación / FIEBRE o Débito</option>
                    <option value="rojo">Rojo - Crítico / Inestable</option>
                </select>

                <label>Tipo de Ubicación:</label>
                <select id="input-tipo">
                    <option value="propia">Cama Propia de Cirugía</option>
                    <option value="prestada">Cama Prestada (Servicio Vecino)</option>
                    <option value="urpa">Retenido en URPA</option>
                </select>

                <button type="submit" class="btn-save">Guardar Datos de Paciente</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
